	<script>
		function escapeHtml(value) {
			return String(value == null ? '' : value).replace(/[&<>'"]/g, function (c) {
				return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
			});
		}

		function field(label, value) {
			return `
				<div class="col-md-6 mb-3">
					<span class="fs-12 text-muted d-block text-uppercase fw-semibold">${escapeHtml(label)}</span>
					<strong class="text-dark">${value === null || value === undefined || value === '' ? '—' : escapeHtml(value)}</strong>
				</div>
			`;
		}

		function formatDateTime(value) {
			if (!value) return '';
			const d = new Date(value);
			return isNaN(d.getTime()) ? String(value) : d.toLocaleString();
		}

		function formatDuration(startTime, endTime) {
			if (!startTime || !endTime) return '';
			const ms = new Date(endTime).getTime() - new Date(startTime).getTime();
			if (!(ms > 0)) return '';
			const mins = Math.round(ms / 60000);
			return mins + ' min';
		}

		const MATCH_BADGE = {
			title_time: { label: 'Matched to Calendar', cls: 'bg-soft-success text-success' },
			time_only: { label: 'Likely Match', cls: 'bg-soft-warning text-warning' },
			none: { label: 'Unmatched', cls: 'bg-soft-secondary text-secondary' }
		};

		let recaps = [];
		let selectedRecapId = null;
		let searchDebounce = null;

		function recapEventUrl(recap) {
			// calendar.html has no deep-link support for opening one
			// specific event's modal on load, so this just gets the user
			// to the calendar rather than claiming to jump straight to it.
			return (recap.erpEventId || recap.msEventId) ? 'calendar.html' : null;
		}

		async function loadRecaps() {
			const listEl = document.getElementById('recapList');
			const countEl = document.getElementById('recapCount');
			listEl.innerHTML = '<div class="text-center py-4 text-muted"><i class="ti ti-loader-2 fs-24 d-block mb-1"></i>Loading...</div>';

			try {
				const search = document.getElementById('recapSearchInput').value.trim();
				const url = '/api/v1/lilypad/meeting-notes/mine' + (search ? '?search=' + encodeURIComponent(search) : '');
				const res = await fetch(url);
				const result = await res.json();
				if (!result.success) throw new Error(result.error);

				recaps = result.data || [];
				countEl.textContent = recaps.length + ' meeting recap' + (recaps.length === 1 ? '' : 's');

				if (!recaps.length) {
					listEl.innerHTML = '<div class="text-center py-4 text-muted"><i class="ti ti-notes-off fs-24 d-block mb-1"></i>No meeting recaps yet.</div>';
					document.getElementById('recapDetailPane').innerHTML = '';
					return;
				}

				listEl.innerHTML = recaps.map((r) => `
					<a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-start gap-2 border-0" onclick="selectRecap('${r._id}')" data-recap-id="${r._id}">
						<span class="badge rounded-pill bg-soft-primary text-primary p-2 flex-shrink-0"><i class="ti ti-microphone"></i></span>
						<div class="flex-grow-1 text-truncate">
							<div class="fw-semibold text-dark fs-13 text-truncate">${escapeHtml(r.title || '(Untitled meeting)')}</div>
							<div class="fs-12 text-muted text-truncate">${escapeHtml(formatDateTime(r.startTime))}</div>
						</div>
					</a>
				`).join('');

				if (!selectedRecapId || !recaps.some((r) => r._id === selectedRecapId)) {
					selectRecap(recaps[0]._id);
				} else {
					markSelectedRow();
				}
			} catch (err) {
				listEl.innerHTML = '<p class="text-danger p-3">' + escapeHtml(err.message) + '</p>';
			}
		}

		function markSelectedRow() {
			document.querySelectorAll('#recapList [data-recap-id]').forEach((el) => {
				el.classList.toggle('active', el.dataset.recapId === selectedRecapId);
			});
		}

		async function selectRecap(id) {
			selectedRecapId = id;
			markSelectedRow();
			const paneEl = document.getElementById('recapDetailPane');
			paneEl.innerHTML = '<div class="card border-0 shadow-sm rounded-3 p-4 text-center text-muted"><i class="ti ti-loader-2 fs-24 d-block mb-1"></i>Loading...</div>';

			try {
				const res = await fetch('/api/v1/lilypad/meeting-notes/' + id);
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				paneEl.innerHTML = renderRecapDetail(result.data);
			} catch (err) {
				paneEl.innerHTML = '<div class="card border-0 shadow-sm rounded-3 p-4"><p class="text-danger mb-0">' + escapeHtml(err.message) + '</p></div>';
			}
		}

		function renderRecapDetail(note) {
			const badge = MATCH_BADGE[note.matchConfidence] || MATCH_BADGE.none;
			const eventUrl = recapEventUrl(note);

			const header = `
				<div class="card border-0 shadow-sm rounded-3 p-4 mb-3">
					<div class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-3">
						<div>
							<h5 class="fw-bold mb-1">${escapeHtml(note.title || '(Untitled meeting)')}</h5>
							<p class="text-muted fs-13 mb-0">${escapeHtml(formatDateTime(note.startTime))}${formatDuration(note.startTime, note.endTime) ? ' &middot; ' + formatDuration(note.startTime, note.endTime) : ''}</p>
						</div>
						<span class="badge rounded-pill ${badge.cls} px-2 py-1 fs-12">${badge.label}</span>
					</div>
					<div class="row">
						${field('Platform', note.platform)}
						${field('Participants', (note.participantEmails || []).join(', '))}
					</div>
					<div class="d-flex flex-wrap gap-2 mt-2">
						${note.reportUrl ? `<a href="${escapeHtml(note.reportUrl)}" target="_blank" rel="noopener" class="btn btn-outline-primary btn-sm rounded-pill px-3"><i class="ti ti-external-link me-1"></i>Open in Read.ai</a>` : ''}
						${eventUrl ? `<a href="${eventUrl}" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="ti ti-calendar-event me-1"></i>Open Calendar</a>` : ''}
					</div>
				</div>
			`;

			const summary = note.summary ? `
				<div class="card border-0 shadow-sm rounded-3 p-4 mb-3">
					<h6 class="fw-bold mb-2"><i class="ti ti-file-text me-1 text-primary"></i>Summary</h6>
					<p class="text-dark mb-0" style="white-space: pre-wrap;">${escapeHtml(note.summary)}</p>
				</div>
			` : '';

			const actionItems = (note.actionItems || []).length ? `
				<div class="card border-0 shadow-sm rounded-3 p-4 mb-3">
					<h6 class="fw-bold mb-3"><i class="ti ti-checklist me-1 text-primary"></i>Action Items</h6>
					${note.actionItems.map((a) => actionItemRow(a)).join('')}
				</div>
			` : '';

			const notesItems = (note.keyQuestions || []).length || (note.topics || []).length ? `
				<div class="card border-0 shadow-sm rounded-3 p-4 mb-3">
					<h6 class="fw-bold mb-3"><i class="ti ti-notes me-1 text-primary"></i>Notes</h6>
					${(note.keyQuestions || []).length ? `
						<div class="mb-3">
							<span class="fs-12 text-muted d-block text-uppercase fw-semibold mb-1">Key Questions</span>
							<ul class="mb-0 ps-3">${note.keyQuestions.map((q) => `<li class="mb-1">${escapeHtml(q.text)}</li>`).join('')}</ul>
						</div>
					` : ''}
					${(note.topics || []).length ? `
						<div>
							<span class="fs-12 text-muted d-block text-uppercase fw-semibold mb-1">Topics</span>
							<div class="d-flex flex-wrap gap-1">${note.topics.map((t) => `<span class="badge bg-soft-secondary text-secondary fs-12 fw-normal">${escapeHtml(t.text)}</span>`).join('')}</div>
						</div>
					` : ''}
				</div>
			` : '';

			const chapters = (note.chapterSummaries || []).length ? `
				<div class="card border-0 shadow-sm rounded-3 p-4 mb-3">
					<h6 class="fw-bold mb-3"><i class="ti ti-list-details me-1 text-primary"></i>Chapters</h6>
					${note.chapterSummaries.map((c) => `
						<div class="mb-3 pb-3 border-bottom">
							<div class="fw-semibold text-dark fs-14 mb-1">${escapeHtml(c.title)}</div>
							<p class="text-muted fs-13 mb-0" style="white-space: pre-wrap;">${escapeHtml(c.description)}</p>
						</div>
					`).join('')}
				</div>
			` : '';

			const transcriptBlocks = (note.transcript && note.transcript.speakerBlocks) || [];
			const transcript = transcriptBlocks.length ? `
				<div class="card border-0 shadow-sm rounded-3 p-4 mb-3">
					<h6 class="fw-bold mb-3"><i class="ti ti-transcript me-1 text-primary"></i>Full Transcript</h6>
					<div style="max-height: 420px; overflow-y: auto;">
						${transcriptBlocks.map((b) => `
							<div class="mb-2">
								<span class="fw-semibold text-dark fs-13">${escapeHtml(b.speakerName || 'Unknown speaker')}</span>
								<p class="text-muted fs-13 mb-0">${escapeHtml(b.words)}</p>
							</div>
						`).join('')}
					</div>
				</div>
			` : '<div class="card border-0 shadow-sm rounded-3 p-4 mb-3 text-muted fs-13">No transcript available for this meeting.</div>';

			return header + summary + actionItems + notesItems + chapters + transcript;
		}

		function actionItemRow(item) {
			const task = item.suggestedTaskId;
			let statusHtml;
			if (!task || task.status === 'pending') {
				const taskId = task ? task._id : '';
				statusHtml = taskId ? `
					<div class="d-flex gap-2 flex-shrink-0">
						<button class="btn btn-outline-success btn-sm rounded-pill px-2 py-0 fs-12" onclick="approveActionItem('${taskId}')"><i class="ti ti-check me-1"></i>Create Task</button>
						<button class="btn btn-outline-secondary btn-sm rounded-pill px-2 py-0 fs-12" onclick="dismissActionItem('${taskId}')"><i class="ti ti-x me-1"></i>Dismiss</button>
					</div>
				` : '';
			} else if (task.status === 'approved') {
				statusHtml = '<span class="badge bg-soft-success text-success fs-12 flex-shrink-0"><i class="ti ti-check me-1"></i>Task Created</span>';
			} else {
				statusHtml = '<span class="badge bg-soft-secondary text-secondary fs-12 flex-shrink-0">Dismissed</span>';
			}
			return `
				<div class="d-flex align-items-center justify-content-between gap-2 py-2 border-bottom" data-action-item="${task ? task._id : ''}">
					<span class="text-dark">${escapeHtml(item.text)}</span>
					${statusHtml}
				</div>
			`;
		}

		async function approveActionItem(taskId) {
			try {
				const res = await fetch('/api/v1/lilypad/email/suggested-tasks/' + taskId + '/approve', { method: 'POST' });
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				selectRecap(selectedRecapId);
			} catch (err) {
				alert(err.message || 'Unable to create task.');
			}
		}

		async function dismissActionItem(taskId) {
			try {
				const res = await fetch('/api/v1/lilypad/email/suggested-tasks/' + taskId + '/dismiss', { method: 'POST' });
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				selectRecap(selectedRecapId);
			} catch (err) {
				alert(err.message || 'Unable to dismiss.');
			}
		}

		document.addEventListener('DOMContentLoaded', async () => {
			try {
				const res = await fetch('/api/v1/lilypad/account/me');
				const result = await res.json();
				if (result.success) {
					document.querySelectorAll('.topbar-user-name').forEach(el => el.textContent = result.data.fullname || '');
					document.querySelectorAll('.topbar-user-role').forEach(el => el.textContent = result.data.role || '');
				}
			} catch (e) {}

			document.getElementById('recapSearchInput').addEventListener('input', () => {
				clearTimeout(searchDebounce);
				searchDebounce = setTimeout(loadRecaps, 300);
			});

			loadRecaps();
		});
	</script>
