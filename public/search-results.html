	<script src="assets/js/bootstrap.bundle.min.js"></script>

	<script>
		function escapeHtml(value) {
			return String(value == null ? '' : value).replace(/[&<>'"]/g, function (c) {
				return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
			});
		}

		function formatCurrency(amount) {
			return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(Number(amount || 0));
		}

		function formatDate(value) {
			if (!value) return '';
			const d = new Date(value);
			return isNaN(d.getTime()) ? String(value) : d.toLocaleDateString();
		}

		async function doLogout() {
			try { await fetch('/logout'); } catch (e) {}
			window.location.href = 'login.html';
		}

		function field(label, value) {
			return `
				<div class="col-md-4 mb-3">
					<span class="fs-12 text-muted d-block text-uppercase fw-semibold">${escapeHtml(label)}</span>
					<strong class="text-dark">${value === null || value === undefined || value === '' ? '—' : escapeHtml(value)}</strong>
				</div>
			`;
		}

		// Same icon each type already uses in the sidebar (lilypad-nav.js),
		// so a result's badge always matches the icon it'd see anywhere
		// else in the app.
		const TYPE_META = {
			ticket: { icon: 'ti-ticket', label: 'Ticket', badgeClass: 'bg-soft-primary text-primary' },
			task: { icon: 'ti-list-check', label: 'Task', badgeClass: 'bg-soft-info text-info' },
			lead: { icon: 'ti-users-group', label: 'Lead', badgeClass: 'bg-soft-warning text-warning' },
			salesforceAccount: { icon: 'ti-building', label: 'Account', badgeClass: 'bg-soft-secondary text-secondary' },
			opportunity: { icon: 'ti-target-arrow', label: 'Opportunity', badgeClass: 'bg-soft-success text-success' },
			order: { icon: 'ti-package', label: 'Order', badgeClass: 'bg-soft-dark text-dark' },
			cartOrder: { icon: 'ti-shopping-cart', label: 'Cart Order', badgeClass: 'bg-soft-purple text-purple' },
			pastDueAccount: { icon: 'ti-cash-banknote', label: 'Past Due', badgeClass: 'bg-soft-danger text-danger' }
		};

		// Fixed order so results read consistently regardless of which
		// categories happened to match.
		const CATEGORY_ORDER = ['ticket', 'task', 'lead', 'salesforceAccount', 'opportunity', 'order', 'cartOrder', 'pastDueAccount'];

		let searchResults = [];
		let selectedIndex = -1;

		function currentQuery() {
			return new URLSearchParams(window.location.search).get('q') || '';
		}

		function goToQuery(q) {
			window.location.href = 'search-results.html?q=' + encodeURIComponent(q);
		}

		async function loadSearchResults() {
			const q = currentQuery();
			document.getElementById('searchResultsInput').value = q;

			const listEl = document.getElementById('searchResultsList');
			const countEl = document.getElementById('searchResultCount');
			const paneEl = document.getElementById('searchDetailPane');

			if (!q || q.trim().length < 2) {
				countEl.textContent = 'Type at least 2 characters to search.';
				listEl.innerHTML = '';
				paneEl.innerHTML = '';
				return;
			}

			listEl.innerHTML = '<div class="text-center py-4 text-muted"><i class="ti ti-loader-2 fs-24 d-block mb-1"></i>Searching...</div>';
			paneEl.innerHTML = '';

			try {
				const res = await fetch('/api/v1/lilypad/search?q=' + encodeURIComponent(q));
				const result = await res.json();
				if (!result.success) throw new Error(result.error);

				searchResults = [];
				CATEGORY_ORDER.forEach(type => {
					(result.data[type] || []).forEach(row => searchResults.push(row));
				});

				countEl.textContent = searchResults.length + ' result' + (searchResults.length === 1 ? '' : 's') + ' for "' + q + '"';

				if (!searchResults.length) {
					listEl.innerHTML = '<div class="text-center py-4 text-muted"><i class="ti ti-search-off fs-24 d-block mb-1"></i>No results found.</div>';
					paneEl.innerHTML = '';
					return;
				}

				listEl.innerHTML = searchResults.map((r, i) => {
					const meta = TYPE_META[r.type] || { icon: 'ti-file', label: r.type, badgeClass: 'bg-soft-secondary text-secondary' };
					return `
						<a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-start gap-2 border-0" onclick="selectResult(${i})" data-result-index="${i}">
							<span class="badge rounded-pill ${meta.badgeClass} p-2 flex-shrink-0"><i class="ti ${meta.icon}"></i></span>
							<div class="flex-grow-1 text-truncate">
								<div class="fw-semibold text-dark fs-13 text-truncate">${escapeHtml(r.title || '(untitled)')}</div>
								<div class="fs-12 text-muted text-truncate">${escapeHtml(r.subtitle || '')}${r.subtitle ? ' &middot; ' : ''}${meta.label}</div>
							</div>
						</a>
					`;
				}).join('');

				selectResult(0);
			} catch (err) {
				listEl.innerHTML = '<p class="text-danger p-3">' + escapeHtml(err.message) + '</p>';
			}
		}

		function markSelectedRow() {
			document.querySelectorAll('#searchResultsList [data-result-index]').forEach(el => {
				el.classList.toggle('active', Number(el.dataset.resultIndex) === selectedIndex);
			});
		}

		async function selectResult(i) {
			selectedIndex = i;
			markSelectedRow();
			const row = searchResults[i];
			const paneEl = document.getElementById('searchDetailPane');
			paneEl.innerHTML = '<div class="card border-0 shadow-sm rounded-3 p-4 text-center text-muted"><i class="ti ti-loader-2 fs-24 d-block mb-1"></i>Loading...</div>';

			try {
				let html;
				if (row.type === 'cartOrder') {
					html = renderCartOrder(row);
				} else if (row.type === 'pastDueAccount') {
					const res = await fetch(row.detailApiUrl);
					const result = await res.json();
					if (!result.success) throw new Error(result.error);
					html = renderPastDueAccount(result.data, result.deliveries || []);
				} else {
					const res = await fetch('/api/v1/lilypad/' + apiPathFor(row.type) + '/' + row.id);
					const result = await res.json();
					if (!result.success) throw new Error(result.error);
					html = RENDERERS[row.type](result.data);
				}
				paneEl.innerHTML = html + viewButtonHtml(row);
			} catch (err) {
				paneEl.innerHTML = '<div class="card border-0 shadow-sm rounded-3 p-4"><p class="text-danger mb-0">' + escapeHtml(err.message) + '</p></div>' + viewButtonHtml(row);
			}
		}

		function apiPathFor(type) {
			return {
				ticket: 'tickets',
				task: 'tasks',
				lead: 'customers',
				salesforceAccount: 'salesforce-accounts',
				opportunity: 'opportunities',
				order: 'orders'
			}[type];
		}

		function viewButtonHtml(row) {
			const label = (row.type === 'cartOrder' || row.type === 'pastDueAccount') ? 'View in List' : 'Open Full Record';
			return `
				<div class="mt-3">
					<a href="${row.detailUrl}" class="btn btn-primary btn-sm rounded-pill px-3">
						<i class="ti ti-arrow-up-right me-1"></i>${label}
					</a>
				</div>
			`;
		}

		function detailCard(title, icon, innerHtml) {
			return `
				<div class="card border-0 shadow-sm rounded-3 p-4">
					<h6 class="fw-bold mb-3"><i class="ti ${icon} me-1 text-primary"></i>${escapeHtml(title)}</h6>
					<div class="row">${innerHtml}</div>
				</div>
			`;
		}

		const RENDERERS = {
			ticket: (t) => detailCard(t.title, 'ti-ticket',
				field('Ticket #', t.formattedUid) +
				field('Status', t.status) +
				field('Priority', t.priority) +
				field('Assignee', t.assignee && t.assignee.fullname) +
				field('Reporter', t.reporter && t.reporter.fullname) +
				field('Category', t.category && t.category.name) +
				'<div class="col-12"><span class="fs-12 text-muted d-block text-uppercase fw-semibold">Description</span><p class="text-dark mb-0">' + escapeHtml(t.description || '—') + '</p></div>'
			),
			task: (t) => detailCard(t.title, 'ti-list-check',
				field('Task #', t.formattedUid) +
				field('Status', t.status) +
				field('Priority', t.priority) +
				field('Due Date', formatDate(t.dueDate)) +
				field('Owner', t.owner && t.owner.fullname) +
				'<div class="col-12"><span class="fs-12 text-muted d-block text-uppercase fw-semibold">Notes</span><p class="text-dark mb-0">' + escapeHtml(t.notes || '—') + '</p></div>'
			),
			lead: (c) => detailCard(c.name, 'ti-users-group',
				field('Company', c.company) +
				field('Industry', c.industry) +
				field('State', c.state) +
				field('Lead Status', c.leadStatus) +
				field('Email', c.email) +
				field('Phone', c.phone)
			),
			salesforceAccount: (a) => detailCard(a.name, 'ti-building',
				field('Type', a.type) +
				field('Industry', a.industry) +
				field('Phone', a.phone) +
				field('Website', a.website) +
				field('Annual Revenue', a.annualRevenue ? formatCurrency(a.annualRevenue) : '')
			),
			opportunity: (o) => detailCard(o.name, 'ti-target-arrow',
				field('Account', o.accountName) +
				field('Stage', o.stageName) +
				field('Amount', o.amount ? formatCurrency(o.amount) : '') +
				field('Close Date', formatDate(o.closeDate)) +
				field('Owner', o.ownerName)
			),
			order: (o) => detailCard(o.orderNumber, 'ti-package',
				field('Account', o.accountName) +
				field('Status', o.status) +
				field('Total', o.totalAmount ? formatCurrency(o.totalAmount) : '') +
				field('Effective Date', formatDate(o.effectiveDate)) +
				field('Account Phone', o.accountPhone)
			)
		};

		function renderCartOrder(row) {
			const d = row.inlineDetail || {};
			const money = new Set(['Grand Total', 'Balance Due']);
			const inner = Object.keys(d).map(k => field(k, money.has(k) ? formatCurrency(d[k]) : d[k])).join('');
			return detailCard(row.title, 'ti-shopping-cart', inner);
		}

		function renderPastDueAccount(data, deliveries) {
			const inner =
				field('Account', data.accountName) +
				field('Amount Due', data.amountDue ? formatCurrency(data.amountDue) : '') +
				field('Original Due', formatDate(data.originalDueDate)) +
				field('Days Late', data.daysLate) +
				field('Status', data.status);
			const deliveriesHtml = deliveries.length
				? '<p class="fs-12 text-muted mb-0 mt-2">' + deliveries.length + ' reminder email(s) sent.</p>'
				: '';
			return detailCard(data.accountName, 'ti-cash-banknote', inner) + deliveriesHtml;
		}

		document.addEventListener('DOMContentLoaded', async () => {
			try {
				const res = await fetch('/api/v1/lilypad/account/me');
				const result = await res.json();
				if (result.success) {
					document.querySelectorAll('.topbar-user-name').forEach(el => el.textContent = result.data.fullname || '');
					document.querySelectorAll('.topbar-user-role').forEach(el => el.textContent = result.data.role || '');
					if (result.data.role === 'admin') {
						const adminNav = document.getElementById('adminSetupNavItem');
						if (adminNav) adminNav.style.display = '';
					}
				}
			} catch (e) {}

			document.getElementById('searchResultsInput').addEventListener('keydown', (e) => {
				if (e.key === 'Enter') {
					const q = e.target.value.trim();
					if (q) goToQuery(q);
				}
			});

			loadSearchResults();
		});
	</script>
