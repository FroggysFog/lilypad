	<script>
		function escapeHtml(value) {
			return String(value == null ? '' : value).replace(/[&<>'"]/g, function (c) {
				return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
			});
		}

		function field(label, value) {
			return `
				<div class="col-md-6 mb-3">
					<span class="fs-12 text-muted d-block text-uppercase fw-semibold">${escapeHtml(label)}</span>
					<strong class="text-dark">${value === null || value === undefined || value === '' ? '—' : escapeHtml(value)}</strong>
				</div>
			`;
		}

		function formatCurrency(amount, currency) {
			if (amount === null || amount === undefined) return '';
			try {
				return new Intl.NumberFormat('en-US', { style: 'currency', currency: currency || 'USD' }).format(Number(amount));
			} catch (e) {
				return '$' + Number(amount).toFixed(2);
			}
		}

		function formatDate(value) {
			if (!value) return '';
			const d = new Date(value);
			return isNaN(d.getTime()) ? String(value) : d.toLocaleDateString();
		}

		let receipts = [];
		let selectedReceiptId = null;
		let searchDebounce = null;

		function isImageAttachment(a) {
			return /^image\//i.test(a.contentType || '');
		}

		async function loadReceipts() {
			const listEl = document.getElementById('receiptList');
			const countEl = document.getElementById('receiptCount');
			listEl.innerHTML = '<div class="text-center py-4 text-muted"><i class="ti ti-loader-2 fs-24 d-block mb-1"></i>Loading...</div>';

			try {
				const search = document.getElementById('receiptSearchInput').value.trim();
				const status = document.getElementById('receiptStatusFilter').value;
				const params = new URLSearchParams({ status });
				if (search) params.set('search', search);

				const res = await fetch('/api/v1/lilypad/receipts?' + params.toString());
				const result = await res.json();
				if (!result.success) throw new Error(result.error);

				receipts = result.data || [];
				countEl.textContent = receipts.length + ' receipt' + (receipts.length === 1 ? '' : 's');

				if (!receipts.length) {
					listEl.innerHTML = '<div class="text-center py-4 text-muted"><i class="ti ti-receipt-off fs-24 d-block mb-1"></i>No receipts found.</div>';
					document.getElementById('receiptDetailPane').innerHTML = '';
					return;
				}

				listEl.innerHTML = receipts.map((r) => `
					<a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-start gap-2 border-0" onclick="selectReceipt('${r._id}')" data-receipt-id="${r._id}">
						<span class="badge rounded-pill bg-soft-success text-success p-2 flex-shrink-0"><i class="ti ti-receipt"></i></span>
						<div class="flex-grow-1 text-truncate">
							<div class="fw-semibold text-dark fs-13 text-truncate">${escapeHtml(r.vendor || r.subject || '(Unknown vendor)')}</div>
							<div class="fs-12 text-muted text-truncate">${formatCurrency(r.amount, r.currency) || '—'}${r.receiptDate ? ' &middot; ' + escapeHtml(formatDate(r.receiptDate)) : ''}</div>
						</div>
					</a>
				`).join('');

				if (!selectedReceiptId || !receipts.some((r) => r._id === selectedReceiptId)) {
					selectReceipt(receipts[0]._id);
				} else {
					markSelectedRow();
				}
			} catch (err) {
				listEl.innerHTML = '<p class="text-danger p-3">' + escapeHtml(err.message) + '</p>';
			}
		}

		function markSelectedRow() {
			document.querySelectorAll('#receiptList [data-receipt-id]').forEach((el) => {
				el.classList.toggle('active', el.dataset.receiptId === selectedReceiptId);
			});
		}

		async function selectReceipt(id) {
			selectedReceiptId = id;
			markSelectedRow();
			const paneEl = document.getElementById('receiptDetailPane');
			paneEl.innerHTML = '<div class="card border-0 shadow-sm rounded-3 p-4 text-center text-muted"><i class="ti ti-loader-2 fs-24 d-block mb-1"></i>Loading...</div>';

			try {
				const res = await fetch('/api/v1/lilypad/receipts/' + id);
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				paneEl.innerHTML = renderReceiptDetail(result.data);
			} catch (err) {
				paneEl.innerHTML = '<div class="card border-0 shadow-sm rounded-3 p-4"><p class="text-danger mb-0">' + escapeHtml(err.message) + '</p></div>';
			}
		}

		function renderReceiptDetail(r) {
			const header = `
				<div class="card border-0 shadow-sm rounded-3 p-4 mb-3">
					<div class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-3">
						<div>
							<h5 class="fw-bold mb-1">${escapeHtml(r.vendor || '(Unknown vendor)')}</h5>
							<p class="text-muted fs-13 mb-0">${escapeHtml(r.subject || '')}</p>
						</div>
						<span class="fs-20 fw-bold text-dark">${formatCurrency(r.amount, r.currency) || '—'}</span>
					</div>
					<div class="row">
						${field('Receipt Date', formatDate(r.receiptDate))}
						${field('Received', formatDate(r.receivedAt))}
					</div>
					${r.summary ? `<p class="text-dark mb-0">${escapeHtml(r.summary)}</p>` : ''}
					<div class="d-flex flex-wrap gap-2 mt-3">
						<a href="email.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="ti ti-mail me-1"></i>Open Email</a>
						${r.status === 'captured' ? `<button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="dismissReceipt('${r._id}')"><i class="ti ti-x me-1"></i>Dismiss</button>` : '<span class="badge bg-soft-secondary text-secondary fs-12 align-self-center">Dismissed</span>'}
					</div>
				</div>
			`;

			const attachments = (r.attachments || []).length ? `
				<div class="card border-0 shadow-sm rounded-3 p-4">
					<h6 class="fw-bold mb-3"><i class="ti ti-paperclip me-1 text-primary"></i>Attachments</h6>
					<div class="d-flex flex-wrap gap-3">
						${r.attachments.map((a) => isImageAttachment(a) ? `
							<a href="/api/v1/lilypad/uploads/${a.path}" target="_blank" rel="noopener">
								<img src="/api/v1/lilypad/uploads/${a.path}" alt="${escapeHtml(a.originalName)}" style="max-width: 200px; max-height: 200px; object-fit: contain;" class="border rounded-2 p-1">
							</a>
						` : `
							<a href="/api/v1/lilypad/uploads/${a.path}" target="_blank" rel="noopener" class="btn btn-outline-primary btn-sm rounded-pill px-3">
								<i class="ti ti-file-download me-1"></i>${escapeHtml(a.originalName)}
							</a>
						`).join('')}
					</div>
				</div>
			` : '<div class="card border-0 shadow-sm rounded-3 p-4 text-muted fs-13">No attachment - this receipt was captured from the email body text.</div>';

			return header + attachments;
		}

		async function dismissReceipt(id) {
			try {
				const res = await fetch('/api/v1/lilypad/receipts/' + id + '/dismiss', { method: 'POST' });
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				loadReceipts();
			} catch (err) {
				alert(err.message || 'Unable to dismiss.');
			}
		}

		document.addEventListener('DOMContentLoaded', async () => {
			try {
				const res = await fetch('/api/v1/lilypad/account/me');
				const result = await res.json();
				if (result.success) {
					document.querySelectorAll('.topbar-user-name').forEach(el => el.textContent = result.data.fullname || '');
					document.querySelectorAll('.topbar-user-role').forEach(el => el.textContent = result.data.role || '');
				}
			} catch (e) {}

			document.getElementById('receiptSearchInput').addEventListener('input', () => {
				clearTimeout(searchDebounce);
				searchDebounce = setTimeout(loadReceipts, 300);
			});
			document.getElementById('receiptStatusFilter').addEventListener('change', loadReceipts);

			loadReceipts();
		});
	</script>
