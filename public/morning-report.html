	<script src="assets/js/bootstrap.bundle.min.js"></script>

	<script>
		function escapeHtml(value) {
			return String(value == null ? '' : value).replace(/[&<>'"]/g, function (c) {
				return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
			});
		}

		function formatCurrency(amount) {
			return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(Number(amount || 0));
		}

		function formatTime(value) {
			if (!value) return '';
			const d = new Date(value);
			return isNaN(d.getTime()) ? '' : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
		}

		function formatDate(value) {
			if (!value) return '';
			const d = new Date(value);
			return isNaN(d.getTime()) ? String(value) : d.toLocaleDateString();
		}

		function sectionCard(title, icon, iconClass, viewAllHref, bodyHtml) {
			return `
				<div class="card border-0 shadow-sm rounded-3 p-4 mb-3">
					<div class="d-flex align-items-center justify-content-between mb-3">
						<h6 class="fw-bold mb-0"><i class="ti ${icon} me-1 ${iconClass}"></i>${escapeHtml(title)}</h6>
						${viewAllHref ? `<a href="${viewAllHref}" class="fs-12 text-decoration-none fw-semibold">View All</a>` : ''}
					</div>
					${bodyHtml}
				</div>
			`;
		}

		function emptyState(message) {
			return `<p class="text-muted fs-13 mb-0">${escapeHtml(message)}</p>`;
		}

		function renderSections(digest) {
			const s = digest.sections || {};
			const parts = [];

			parts.push(sectionCard('Today\'s Calendar', 'ti-calendar-event', 'text-primary', 'calendar.html',
				(s.calendar || []).length
					? (s.calendar.map(e => `
						<div class="d-flex align-items-center justify-content-between py-2 border-bottom">
							<div>
								<strong class="d-block text-dark fs-13">${escapeHtml(e.title)}</strong>
								<span class="fs-12 text-muted">${formatTime(e.start)} - ${formatTime(e.end)}${e.location ? ' &middot; ' + escapeHtml(e.location) : ''}</span>
							</div>
							${e.onlineMeetingUrl ? `<a href="${escapeHtml(e.onlineMeetingUrl)}" target="_blank" rel="noopener" class="btn btn-sm btn-outline-primary rounded-pill px-2 py-0 fs-12">Join</a>` : ''}
						</div>
					`).join(''))
					: emptyState('No meetings on your calendar today.')
			));

			parts.push(sectionCard('Tasks Due Today', 'ti-list-check', 'text-info', 'tasks.html',
				(s.tasksDueToday || []).length
					? (s.tasksDueToday.map(t => `
						<div class="d-flex align-items-center justify-content-between py-2 border-bottom">
							<strong class="d-block text-dark fs-13">${escapeHtml(t.title)}</strong>
							<span class="badge ${t.overdue ? 'bg-soft-danger text-danger' : 'bg-soft-secondary text-secondary'} fs-11">${t.overdue ? 'Overdue' : t.priority}</span>
						</div>
					`).join(''))
					: emptyState('Nothing due today.')
			));

			parts.push(sectionCard('Priority Conversations', 'ti-user-star', 'text-primary', 'email.html',
				(s.priorityConversations || []).length
					? (s.priorityConversations.map(c => `
						<div class="py-2 border-bottom">
							<strong class="d-block text-dark fs-13">${escapeHtml(c.name)} <span class="badge bg-soft-primary text-primary fs-11">${c.blockerCount}</span></strong>
							<span class="fs-12 text-muted">${escapeHtml(c.summary || '')}</span>
						</div>
					`).join(''))
					: emptyState('Nothing needs your reply right now.')
			));

			parts.push(sectionCard('Suggested Tasks', 'ti-bulb', 'text-warning', 'email.html',
				(s.suggestedTasks || []).length
					? (s.suggestedTasks.map(t => `
						<div class="d-flex align-items-center justify-content-between py-2 border-bottom">
							<span class="text-dark fs-13">${escapeHtml(t.title)}</span>
							<span class="badge bg-soft-secondary text-secondary fs-11">${t.source === 'meeting' ? 'From meeting' : 'From email'}</span>
						</div>
					`).join(''))
					: emptyState('No pending suggestions.')
			));

			parts.push(sectionCard('Recent Meeting Notes', 'ti-notes', 'text-primary', 'meeting-recaps.html',
				(s.meetingNotes || []).length
					? (s.meetingNotes.map(n => `
						<div class="py-2 border-bottom">
							<strong class="d-block text-dark fs-13">${escapeHtml(n.title)}</strong>
							<span class="fs-12 text-muted">${n.actionItemCount} action item(s) &middot; ${escapeHtml(n.summary || '')}</span>
						</div>
					`).join(''))
					: emptyState('No new meeting notes since yesterday.')
			));

			parts.push(sectionCard('Recent Chats', 'ti-brand-teams', 'text-primary', null,
				(s.chatActivity || []).length
					? (s.chatActivity.map(c => `
						<div class="py-2 border-bottom">
							<strong class="d-block text-dark fs-13">${escapeHtml(c.chatName)}</strong>
							<span class="fs-12 text-muted">${escapeHtml(c.lastMessagePreview || '')}</span>
						</div>
					`).join(''))
					: emptyState('No recent chat activity, or Teams chat is not connected.')
			));

			const closingSoon = (s.pipelineAlerts && s.pipelineAlerts.closingSoon) || [];
			const stalled = (s.pipelineAlerts && s.pipelineAlerts.stalled) || [];
			parts.push(sectionCard('Pipeline Alerts', 'ti-target-arrow', 'text-success', 'opportunities.html',
				(closingSoon.length || stalled.length)
					? (
						closingSoon.map(o => `
							<div class="d-flex align-items-center justify-content-between py-2 border-bottom">
								<span class="text-dark fs-13">${escapeHtml(o.name)}</span>
								<span class="badge bg-soft-success text-success fs-11">${formatCurrency(o.amount)} &middot; closes ${formatDate(o.closeDate)}</span>
							</div>
						`).join('') +
						stalled.map(o => `
							<div class="d-flex align-items-center justify-content-between py-2 border-bottom">
								<span class="text-dark fs-13">${escapeHtml(o.name)}</span>
								<span class="badge bg-soft-warning text-warning fs-11">Stalled &middot; ${formatCurrency(o.amount)}</span>
							</div>
						`).join('')
					)
					: emptyState('No pipeline alerts - nothing closing soon or stalled.')
			));

			document.getElementById('morningReportSections').innerHTML = parts.join('');
		}

		function renderDigest(digest) {
			document.getElementById('morningGreeting').textContent = digest.greeting;
			document.getElementById('morningReportDate').textContent = 'For ' + digest.digestDate + ' - generated ' + new Date(digest.generatedAt).toLocaleTimeString();
			renderSections(digest);
		}

		async function loadMorningReport() {
			try {
				const res = await fetch('/api/v1/lilypad/morning-digest');
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				renderDigest(result.data);
			} catch (err) {
				document.getElementById('morningGreeting').textContent = 'Unable to load your morning report: ' + err.message;
			}
		}

		async function refreshMorningReport() {
			const btn = document.getElementById('refreshBtn');
			btn.disabled = true;
			document.getElementById('morningGreeting').textContent = 'Refreshing...';
			try {
				const res = await fetch('/api/v1/lilypad/morning-digest/refresh', { method: 'POST' });
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				renderDigest(result.data);
			} catch (err) {
				document.getElementById('morningGreeting').textContent = 'Unable to refresh: ' + err.message;
			} finally {
				btn.disabled = false;
			}
		}

		document.addEventListener('DOMContentLoaded', async () => {
			try {
				const res = await fetch('/api/v1/lilypad/account/me');
				const result = await res.json();
				if (result.success) {
					document.querySelectorAll('.topbar-user-name').forEach(el => el.textContent = result.data.fullname || '');
					document.querySelectorAll('.topbar-user-role').forEach(el => el.textContent = result.data.role || '');
				}
			} catch (e) {}

			loadMorningReport();
		});
	</script>
