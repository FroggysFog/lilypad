		.email-row.active { background: rgba(var(--bs-primary-rgb), 0.08); border-left-color: var(--bs-primary); }
		.email-row.unread .email-subject { font-weight: 700; color: var(--bs-dark, #1e293b); }
		.email-row .email-preview { color: #94a3b8; }

	<script>
		let emailCurrentFolder = 'inbox';
		let emailSkip = 0;
		let emailMessages = [];
		let emailActiveId = null;
		let currentThreadMessages = [];
		let replyMode = null; // 'reply' | 'replyAll' | 'forward'
		let composeDraftId = null;
		let graymailMessages = [];
		const EMAIL_PAGE_SIZE = 25;

		function escapeHtml(str) {
			if (str === null || str === undefined) return '';
			return String(str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;');
		}

		function timeAgo(iso) {
			if (!iso) return '';
			const diffMs = Date.now() - new Date(iso).getTime();
			const mins = Math.round(diffMs / 60000);
			if (mins < 1) return 'just now';
			if (mins < 60) return mins + 'm ago';
			const hours = Math.round(mins / 60);
			if (hours < 24) return hours + 'h ago';
			const days = Math.round(hours / 24);
			if (days < 7) return days + 'd ago';
			return new Date(iso).toLocaleDateString();
		}

		async function loadMicrosoftStatus() {
			const textEl = document.getElementById('msConnectionText');
			const actionsEl = document.getElementById('msConnectionActions');
			const appEl = document.getElementById('emailApp');
			try {
				const res = await fetch('/api/v1/lilypad/calendar/microsoft/status');
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				const status = result.data;

				if (!status.configured) {
					textEl.textContent = 'Microsoft 365 sync is not configured on the server yet.';
					actionsEl.innerHTML = '';
					appEl.style.display = 'none';
				} else if (status.connected) {
					textEl.innerHTML = `Connected as <strong>${escapeHtml(status.msEmail)}</strong>`;
					actionsEl.innerHTML = '';
					appEl.style.display = '';
					loadEmailList();
					loadGraymailDigest();
				} else {
					textEl.textContent = "Your Microsoft account isn't connected yet - connect it to pull in your inbox.";
					actionsEl.innerHTML = '<a href="/auth/microsoft-calendar/connect" class="btn btn-sm btn-primary"><i class="ti ti-brand-windows me-1"></i>Connect Microsoft 365</a>';
					appEl.style.display = 'none';
				}
			} catch (err) {
				textEl.textContent = 'Unable to check Microsoft connection status.';
				console.error('loadMicrosoftStatus failed:', err);
			}
		}

		function emailRowMarkup(msg) {
			const isDraft = emailCurrentFolder === 'drafts';
			const fromName = isDraft
				? 'To: ' + ((msg.toRecipients || []).map(r => r.name || r.address).join(', ') || '(no recipient yet)')
				: (msg.from && (msg.from.name || msg.from.address)) || 'Unknown sender';
			const unreadClass = msg.isRead ? '' : 'unread';
			const activeClass = msg.id === emailActiveId ? 'active' : '';
			return `
				<div class="email-row p-3 border-bottom ${unreadClass} ${activeClass}" data-id="${msg.id}">
					<div class="d-flex align-items-center justify-content-between mb-1">
						<span class="fs-13 email-subject text-dark text-truncate">${escapeHtml(fromName)}</span>
						<span class="fs-11 text-muted flex-shrink-0 ms-2">${escapeHtml(timeAgo(msg.receivedDateTime))}</span>
					</div>
					<div class="fs-13 email-subject text-dark text-truncate mb-1">${escapeHtml(msg.subject)}</div>
					<div class="fs-12 email-preview text-truncate">${escapeHtml(msg.bodyPreview)}</div>
				</div>
			`;
		}

		function renderEmailList() {
			const pane = document.getElementById('emailListPane');
			const html = emailMessages.map(emailRowMarkup).join('') || '<div class="text-center text-muted fs-13 py-4">No messages here.</div>';
			pane.innerHTML = html;
			pane.querySelectorAll('.email-row').forEach(row => {
				row.addEventListener('click', () => {
					if (emailCurrentFolder === 'drafts') openComposeModal({ draftId: row.dataset.id });
					else openEmail(row.dataset.id);
				});
			});
		}

		async function loadEmailList(reset = true) {
			if (reset) { emailSkip = 0; emailMessages = []; }
			const pane = document.getElementById('emailListPane');
			pane.innerHTML = '<div class="text-center text-muted fs-13 py-4"><span class="spinner-border spinner-border-sm me-1"></span> Loading...</div>';
			try {
				const params = new URLSearchParams({ folder: emailCurrentFolder, skip: emailSkip });
				const res = await fetch('/api/v1/lilypad/email/messages?' + params.toString());
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				emailMessages = reset ? result.data : emailMessages.concat(result.data);
				document.getElementById('emailLoadMoreBtn').style.display = result.data.length < EMAIL_PAGE_SIZE ? 'none' : '';
				renderEmailList();
			} catch (err) {
				pane.innerHTML = '<div class="text-center text-danger fs-13 py-4">' + escapeHtml(err.message) + '</div>';
			}
		}

		function resetReaderPane() {
			document.getElementById('emailReaderPane').innerHTML = '<div class="text-center py-5 text-muted"><i class="ti ti-mail-opened fs-36"></i><p class="fs-13 mb-0 mt-2">Select a message to read it.</p></div>';
		}

		function removeFromListAndReset(id) {
			emailMessages = emailMessages.filter(m => m.id !== id);
			renderEmailList();
			resetReaderPane();
		}

		// --- Reading pane: full conversation thread, not just one message ---

		function renderMessageBodyInto(container, msg) {
			if (msg.bodyHtml) {
				const iframe = document.createElement('iframe');
				iframe.className = 'thread-body-frame';
				iframe.setAttribute('sandbox', ''); // no scripts, no same-origin - fully inert
				container.appendChild(iframe);
				iframe.srcdoc = msg.bodyHtml;
			} else {
				const pre = document.createElement('pre');
				pre.className = 'fs-13 mb-0';
				pre.style.cssText = 'white-space:pre-wrap; font-family:inherit;';
				pre.textContent = msg.bodyText || '';
				container.appendChild(pre);
			}
		}

		async function openEmail(id) {
			emailActiveId = id;
			currentThreadMessages = [];
			replyMode = null;
			renderEmailList();
			const reader = document.getElementById('emailReaderPane');
			reader.innerHTML = '<div class="text-center text-muted py-5"><span class="spinner-border spinner-border-sm me-1"></span> Loading message...</div>';
			try {
				const res = await fetch('/api/v1/lilypad/email/messages/' + encodeURIComponent(id) + '/thread');
				const result = await res.json();
				if (!result.success) throw new Error(result.error);

				if (result.data.length) {
					currentThreadMessages = result.data;
				} else {
					// No conversationId match found (rare - very old mail
					// without one, or a live-fetched message not yet synced) -
					// fall back to just the single message.
					const soloRes = await fetch('/api/v1/lilypad/email/messages/' + encodeURIComponent(id));
					const soloResult = await soloRes.json();
					if (!soloResult.success) throw new Error(soloResult.error);
					currentThreadMessages = [soloResult.data];
				}
				renderThread();

				const m = emailMessages.find(x => x.id === id);
				if (m) m.isRead = true;
			} catch (err) {
				reader.innerHTML = '<div class="text-danger fs-13">' + escapeHtml(err.message) + '</div>';
			}
		}

		function renderThread() {
			const reader = document.getElementById('emailReaderPane');
			const latest = currentThreadMessages[currentThreadMessages.length - 1];
			const isArchiveFolder = emailCurrentFolder === 'archive';

			const itemsHtml = currentThreadMessages.map((msg, idx) => {
				const isLast = idx === currentThreadMessages.length - 1;
				const fromLabel = (msg.from && (msg.from.name || msg.from.address)) || 'You';
				return `
					<div class="thread-item border rounded-3 mb-2 ${isLast ? '' : 'is-collapsed'}" data-thread-idx="${idx}">
						<div class="thread-item-header p-2 px-3 d-flex align-items-center justify-content-between rounded-3">
							<div class="d-flex align-items-center gap-2" style="min-width:0;">
								<strong class="fs-13 text-truncate">${escapeHtml(fromLabel)}</strong>
								<span class="fs-11 text-muted flex-shrink-0">${escapeHtml(msg.receivedDateTime ? new Date(msg.receivedDateTime).toLocaleString() : '')}</span>
							</div>
							<i class="ti ti-chevron-down"></i>
						</div>
						<div class="thread-body p-3" data-thread-body="${idx}"></div>
					</div>
				`;
			}).join('');

			reader.innerHTML = `
				<div class="d-flex align-items-center justify-content-between mb-2 pb-2 border-bottom flex-wrap gap-2">
					<h5 class="fw-bold mb-0">${escapeHtml(latest.subject)}</h5>
					<div class="d-flex align-items-center gap-1">
						<button type="button" class="btn btn-sm btn-outline-primary" id="emailReplyBtn"><i class="ti ti-arrow-back-up me-1"></i>Reply</button>
						<button type="button" class="btn btn-sm btn-outline-primary" id="emailReplyAllBtn"><i class="ti ti-arrow-back-up-double me-1"></i>Reply All</button>
						<button type="button" class="btn btn-sm btn-outline-secondary" id="emailForwardBtn"><i class="ti ti-arrow-forward-up me-1"></i>Forward</button>
						${isArchiveFolder ? '' : '<button type="button" class="btn btn-sm btn-outline-secondary" id="emailArchiveBtn" title="Archive"><i class="ti ti-archive"></i></button>'}
						<button type="button" class="btn btn-sm btn-outline-danger" id="emailDeleteBtn" title="Delete"><i class="ti ti-trash"></i></button>
					</div>
				</div>
				<div id="emailThreadItems">${itemsHtml}</div>
				<div id="emailInlineReplyBar" style="display:none;" class="border-top pt-3 mt-2">
					<div class="d-flex align-items-center gap-2 mb-2">
						<span class="badge bg-soft-primary text-primary" id="emailReplyModeLabel">Reply</span>
						<input type="text" id="emailForwardTo" class="form-control form-control-sm" placeholder="To: name@company.com, ..." style="display:none; max-width:360px;" list="erpUserEmails">
					</div>
					<div id="emailReplyBody" class="rich-editor form-control" contenteditable="true" data-placeholder="Write a reply..."></div>
					<div class="d-flex justify-content-end gap-2 mt-2">
						<button type="button" class="btn btn-sm btn-light" id="emailReplyCancelBtn">Cancel</button>
						<button type="button" class="btn btn-sm btn-primary" id="emailReplySendBtn"><i class="ti ti-send me-1"></i> Send</button>
					</div>
				</div>
			`;

			currentThreadMessages.forEach((msg, idx) => {
				renderMessageBodyInto(reader.querySelector(`[data-thread-body="${idx}"]`), msg);
			});

			reader.querySelectorAll('.thread-item-header').forEach(header => {
				header.addEventListener('click', () => header.closest('.thread-item').classList.toggle('is-collapsed'));
			});

			document.getElementById('emailReplyBtn').addEventListener('click', () => startReply('reply'));
			document.getElementById('emailReplyAllBtn').addEventListener('click', () => startReply('replyAll'));
			document.getElementById('emailForwardBtn').addEventListener('click', () => startReply('forward'));
			document.getElementById('emailReplyCancelBtn').addEventListener('click', () => { document.getElementById('emailInlineReplyBar').style.display = 'none'; });
			document.getElementById('emailReplySendBtn').addEventListener('click', sendInlineReply);
			const archiveBtn = document.getElementById('emailArchiveBtn');
			if (archiveBtn) archiveBtn.addEventListener('click', archiveCurrentEmail);
			document.getElementById('emailDeleteBtn').addEventListener('click', deleteCurrentEmail);
		}

		function startReply(mode) {
			replyMode = mode;
			const bar = document.getElementById('emailInlineReplyBar');
			const label = document.getElementById('emailReplyModeLabel');
			const toInput = document.getElementById('emailForwardTo');
			const body = document.getElementById('emailReplyBody');
			label.textContent = mode === 'reply' ? 'Reply' : mode === 'replyAll' ? 'Reply All' : 'Forward';
			toInput.style.display = mode === 'forward' ? '' : 'none';
			toInput.value = '';
			body.innerHTML = '';
			bar.style.display = '';
			body.focus();
		}

		async function sendInlineReply() {
			const latest = currentThreadMessages[currentThreadMessages.length - 1];
			const body = document.getElementById('emailReplyBody');
			const comment = body.innerHTML.trim();
			if (!comment) return;
			const sendBtn = document.getElementById('emailReplySendBtn');
			sendBtn.disabled = true;
			try {
				if (replyMode === 'forward') {
					const toRecipients = document.getElementById('emailForwardTo').value.split(',').map(s => s.trim()).filter(Boolean);
					if (!toRecipients.length) { alert('Add at least one recipient to forward to.'); sendBtn.disabled = false; return; }
					const res = await fetch('/api/v1/lilypad/email/messages/' + encodeURIComponent(latest.id) + '/forward', {
						method: 'POST', headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ comment, toRecipients })
					});
					const result = await res.json();
					if (!result.success) throw new Error(result.error);
				} else {
					const res = await fetch('/api/v1/lilypad/email/messages/' + encodeURIComponent(latest.id) + '/reply', {
						method: 'POST', headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ comment, replyAll: replyMode === 'replyAll' })
					});
					const result = await res.json();
					if (!result.success) throw new Error(result.error);
				}
				await loadEmailList();
				await openEmail(latest.id);
			} catch (err) {
				alert(err.message || 'Unable to send.');
				sendBtn.disabled = false;
			}
		}

		async function archiveCurrentEmail() {
			const latest = currentThreadMessages[currentThreadMessages.length - 1];
			try {
				const res = await fetch('/api/v1/lilypad/email/messages/' + encodeURIComponent(latest.id) + '/move', {
					method: 'POST', headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ destination: 'archive' })
				});
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				removeFromListAndReset(latest.id);
			} catch (err) {
				alert(err.message || 'Unable to archive.');
			}
		}

		async function deleteCurrentEmail() {
			const latest = currentThreadMessages[currentThreadMessages.length - 1];
			if (!confirm('Delete this message?')) return;
			try {
				const res = await fetch('/api/v1/lilypad/email/messages/' + encodeURIComponent(latest.id), { method: 'DELETE' });
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				removeFromListAndReset(latest.id);
			} catch (err) {
				alert(err.message || 'Unable to delete.');
			}
		}

		// --- Graymail digest: quiet, collapsed-by-default, Inbox only -------

		function graymailRowMarkup(msg) {
			const fromName = (msg.from && (msg.from.name || msg.from.address)) || 'Unknown sender';
			return `
				<div class="graymail-row px-3 py-2 border-bottom" data-id="${msg.id}" style="cursor:pointer;">
					<div class="d-flex align-items-center justify-content-between">
						<span class="fs-12 fw-semibold text-dark text-truncate">${escapeHtml(fromName)}</span>
						<span class="fs-11 text-muted flex-shrink-0 ms-2">${escapeHtml(timeAgo(msg.receivedDateTime))}</span>
					</div>
					<div class="fs-12 text-muted text-truncate">${escapeHtml(msg.subject)}</div>
				</div>
			`;
		}

		async function loadGraymailDigest() {
			const banner = document.getElementById('graymailBanner');
			if (emailCurrentFolder !== 'inbox') { banner.classList.add('d-none'); return; }
			try {
				const res = await fetch('/api/v1/lilypad/email/graymail-digest');
				const result = await res.json();
				if (!result.success || !result.data.length) { banner.classList.add('d-none'); return; }
				graymailMessages = result.data;
				document.getElementById('graymailCount').textContent = graymailMessages.length;
				banner.classList.remove('d-none');
				banner.classList.add('d-flex');
			} catch (err) {
				console.error('Unable to load graymail digest:', err);
			}
		}

		document.getElementById('graymailBanner').addEventListener('click', () => {
			const pane = document.getElementById('graymailDigestPane');
			const chevron = document.getElementById('graymailChevron');
			const expanded = !pane.classList.contains('d-none');
			if (expanded) {
				pane.classList.add('d-none');
				chevron.className = 'ti ti-chevron-down ms-auto';
				return;
			}
			pane.innerHTML = graymailMessages.map(graymailRowMarkup).join('');
			pane.querySelectorAll('.graymail-row').forEach(row => {
				row.addEventListener('click', () => openEmail(row.dataset.id));
			});
			pane.classList.remove('d-none');
			chevron.className = 'ti ti-chevron-up ms-auto';
		});

		document.getElementById('emailFolderTabs').addEventListener('click', (e) => {
			const btn = e.target.closest('button[data-folder]');
			if (!btn) return;
			document.querySelectorAll('#emailFolderTabs .nav-link').forEach(b => b.classList.remove('active'));
			btn.classList.add('active');
			emailCurrentFolder = btn.dataset.folder;
			emailActiveId = null;
			resetReaderPane();
			document.getElementById('graymailDigestPane').classList.add('d-none');
			loadEmailList();
			loadGraymailDigest();
		});

		document.getElementById('emailRefreshBtn').addEventListener('click', () => { loadEmailList(); loadGraymailDigest(); });
		document.getElementById('emailLoadMoreBtn').addEventListener('click', () => {
			emailSkip += EMAIL_PAGE_SIZE;
			loadEmailList(false);
		});

		// --- Compose modal (new messages + editing existing drafts) ---------

		function execCmd(cmd) {
			document.execCommand(cmd, false, null);
		}

		document.querySelectorAll('.rte-toolbar [data-cmd]').forEach(btn => {
			btn.addEventListener('mousedown', (e) => e.preventDefault()); // keep the editor's text selection intact
			btn.addEventListener('click', () => execCmd(btn.dataset.cmd));
		});
		document.getElementById('composeLinkBtn').addEventListener('mousedown', (e) => e.preventDefault());
		document.getElementById('composeLinkBtn').addEventListener('click', () => {
			const url = prompt('Link URL:');
			if (url) document.execCommand('createLink', false, url);
		});

		function resetComposeForm() {
			composeDraftId = null;
			document.getElementById('composeTo').value = '';
			document.getElementById('composeCc').value = '';
			document.getElementById('composeSubject').value = '';
			document.getElementById('composeBody').innerHTML = '';
			document.getElementById('composeAttachmentInput').value = '';
			document.getElementById('composeAttachmentList').innerHTML = '';
			document.getElementById('composeSaveStatus').innerHTML = '&nbsp;';
		}

		async function openComposeModal (opts = {}) {
			resetComposeForm();
			if (opts.draftId) {
				composeDraftId = opts.draftId;
				document.getElementById('composeSaveStatus').textContent = 'Loading draft...';
				try {
					const res = await fetch('/api/v1/lilypad/email/messages/' + encodeURIComponent(opts.draftId));
					const result = await res.json();
					if (!result.success) throw new Error(result.error);
					const msg = result.data;
					document.getElementById('composeTo').value = (msg.toRecipients || []).map(r => r.address).join(', ');
					document.getElementById('composeSubject').value = msg.subject === '(No subject)' ? '' : msg.subject;
					document.getElementById('composeBody').innerHTML = msg.bodyHtml || '';
					document.getElementById('composeSaveStatus').innerHTML = '&nbsp;';
				} catch (err) {
					document.getElementById('composeSaveStatus').textContent = err.message;
				}
			}
			bootstrap.Modal.getOrCreateInstance(document.getElementById('composeModal')).show();
		}

		function currentComposeFields() {
			return {
				subject: document.getElementById('composeSubject').value.trim(),
				bodyHtml: document.getElementById('composeBody').innerHTML,
				toRecipients: document.getElementById('composeTo').value.split(',').map(s => s.trim()).filter(Boolean),
				ccRecipients: document.getElementById('composeCc').value.split(',').map(s => s.trim()).filter(Boolean)
			};
		}

		async function ensureDraftExists() {
			if (composeDraftId) return composeDraftId;
			const res = await fetch('/api/v1/lilypad/email/drafts', {
				method: 'POST', headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(currentComposeFields())
			});
			const result = await res.json();
			if (!result.success) throw new Error(result.error);
			composeDraftId = result.data.id;
			return composeDraftId;
		}

		async function autoSaveDraft() {
			const fields = currentComposeFields();
			const hasContent = fields.subject || fields.bodyHtml.replace(/<[^>]+>/g, '').trim() || fields.toRecipients.length;
			if (!hasContent) return;
			const statusEl = document.getElementById('composeSaveStatus');
			try {
				statusEl.textContent = 'Saving...';
				if (!composeDraftId) {
					await ensureDraftExists();
				} else {
					const res = await fetch('/api/v1/lilypad/email/drafts/' + encodeURIComponent(composeDraftId), {
						method: 'PATCH', headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(fields)
					});
					const result = await res.json();
					if (!result.success) throw new Error(result.error);
				}
				statusEl.textContent = 'Saved as draft ' + new Date().toLocaleTimeString();
			} catch (err) {
				statusEl.textContent = 'Unable to save draft: ' + err.message;
			}
		}

		let composeAutoSaveTimer = null;
		['composeTo', 'composeCc', 'composeSubject'].forEach(id => {
			document.getElementById(id).addEventListener('input', () => {
				clearTimeout(composeAutoSaveTimer);
				composeAutoSaveTimer = setTimeout(autoSaveDraft, 2000);
			});
		});
		document.getElementById('composeBody').addEventListener('input', () => {
			clearTimeout(composeAutoSaveTimer);
			composeAutoSaveTimer = setTimeout(autoSaveDraft, 2000);
		});

		document.getElementById('composeAttachmentInput').addEventListener('change', async (e) => {
			const files = Array.from(e.target.files || []);
			if (!files.length) return;
			const listEl = document.getElementById('composeAttachmentList');
			try {
				const draftId = await ensureDraftExists();
				for (const file of files) {
					listEl.innerHTML += `<div>Uploading ${escapeHtml(file.name)}...</div>`;
					const formData = new FormData();
					formData.append('file', file);
					const res = await fetch('/api/v1/lilypad/email/drafts/' + encodeURIComponent(draftId) + '/attachments', {
						method: 'POST', body: formData
					});
					const result = await res.json();
					if (!result.success) throw new Error(result.error);
				}
				listEl.innerHTML = files.map(f => `<div><i class="ti ti-paperclip me-1"></i>${escapeHtml(f.name)}</div>`).join('');
			} catch (err) {
				listEl.innerHTML += `<div class="text-danger">${escapeHtml(err.message)}</div>`;
			}
		});

		document.getElementById('emailComposeBtn').addEventListener('click', () => openComposeModal());

		document.getElementById('composeSendBtn').addEventListener('click', async () => {
			const fields = currentComposeFields();
			if (!fields.toRecipients.length) { alert('Add at least one recipient.'); return; }
			const btn = document.getElementById('composeSendBtn');
			btn.disabled = true;
			try {
				const draftId = await ensureDraftExists();
				await fetch('/api/v1/lilypad/email/drafts/' + encodeURIComponent(draftId), {
					method: 'PATCH', headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(fields)
				});
				const res = await fetch('/api/v1/lilypad/email/drafts/' + encodeURIComponent(draftId) + '/send', { method: 'POST' });
				const result = await res.json();
				if (!result.success) throw new Error(result.error);
				bootstrap.Modal.getInstance(document.getElementById('composeModal'))?.hide();
				if (emailCurrentFolder === 'sent' || emailCurrentFolder === 'drafts') loadEmailList();
			} catch (err) {
				alert(err.message || 'Unable to send.');
			} finally {
				btn.disabled = false;
			}
		});

		async function closeComposeDiscarding() {
			if (composeDraftId) {
				try { await fetch('/api/v1/lilypad/email/drafts/' + encodeURIComponent(composeDraftId), { method: 'DELETE' }); } catch (err) {}
			}
			bootstrap.Modal.getInstance(document.getElementById('composeModal'))?.hide();
			if (emailCurrentFolder === 'drafts') loadEmailList();
		}

		document.getElementById('composeDiscardBtn').addEventListener('click', closeComposeDiscarding);
		document.getElementById('composeCloseBtn').addEventListener('click', () => {
			// The X just closes (keeping the draft, like Outlook's own
			// "close and save" behavior) - Discard is the explicit delete.
			bootstrap.Modal.getInstance(document.getElementById('composeModal'))?.hide();
			if (emailCurrentFolder === 'drafts') loadEmailList();
		});

		async function loadErpUserEmails() {
			try {
				const res = await fetch('/api/v1/lilypad/users');
				const result = await res.json();
				if (!result.success) return;
				document.getElementById('erpUserEmails').innerHTML = result.data.map(u => `<option value="${escapeHtml(u.email)}">${escapeHtml(u.fullname)}</option>`).join('');
			} catch (err) {
				console.error('Unable to load ERP user directory:', err);
			}
		}

		async function loadMe() {
			try {
				const res = await fetch('/api/v1/lilypad/account/me');
				const result = await res.json();
				if (!result.success) return;
				document.querySelectorAll('.topbar-user-name').forEach(el => el.textContent = result.data.fullname || '');
				document.querySelectorAll('.topbar-user-role').forEach(el => el.textContent = result.data.role || '');
			} catch (err) {
				console.error('Unable to load current user:', err);
			}
		}

		document.addEventListener('DOMContentLoaded', async function () {
			await loadMe();
			await loadErpUserEmails();
			await loadMicrosoftStatus();
		});
	</script>
</body>

</html>
