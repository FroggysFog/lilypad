services:
  - type: web
    name: lilypad-erp-dev
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: "npm install --legacy-peer-deps"
    startCommand: "node app.js"
    healthCheckPath: "/api/v1/lilypad/tickets/todo"
    autoDeploy: true
    disk:
      name: lilypad-uploads
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 16.20.2
      - key: PORT
        value: 8118
      - key: PRIMARY_INBOUND_EMAIL
        value: support@lilypad.local
      - key: ENABLE_ANTI_SPAM_SHIELD
        value: "true"
      - key: SESSION_SECRET
        sync: false
      # Salesforce Connected App (past-due payments sync) - fill in via the Render dashboard
      - key: SF_LOGIN_URL
        sync: false
      - key: SF_CLIENT_ID
        sync: false
      - key: SF_CLIENT_SECRET
        sync: false
      - key: SF_CALLBACK_URL
        sync: false
      - key: SF_OVERDUE_REPORT_ID
        sync: false
      - key: SF_OVERDUE_SOQL
        sync: false
      # Override if the default Lead query's guessed custom field names
      # (Import_Notes__c, Trade_Show__c) don't match this org's Salesforce schema
      - key: SF_LEADS_SOQL
        sync: false
      - key: REMINDER_CHECK_MINUTES
        value: "5"
      # SMTP (past-due payment reminder emails) - fill in via the Render dashboard
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

