services:
  - type: web
    name: lilypad-erp-dev
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    # Switched from the native Node runtime to a Dockerfile build.
    # Confirmed live: the in-house crawler's directory/form searches were
    # completing with 0 businesses found - `chromium.launch()` was
    # throwing on a missing shared library (libnss3 etc.) and getting
    # swallowed by discovery's per-source try/catch, so nothing surfaced
    # in the UI. Root cause: `playwright install --with-deps` needs root
    # to apt-get those libraries, and Render's native runtime build
    # container doesn't grant that ("su: Authentication failure" when
    # first tried) - a plain Docker build runs as root by default, so
    # --with-deps works there. See Dockerfile for the actual install step.
    healthCheckPath: "/api/v1/lilypad/tickets/todo"
    autoDeploy: true
    disk:
      name: lilypad-uploads
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      # Node version is now pinned by the Dockerfile's FROM line, not this
      # env var (NODE_VERSION only affects Render's native-runtime nvm
      # install, which is no longer in play) - see crawlerService.js's
      # Node-version guard for what happens if the Dockerfile's base image
      # ever regresses below the Node 20+ Playwright requires.
      - key: PORT
        value: 8118
      - key: PRIMARY_INBOUND_EMAIL
        value: support@lilypad.local
      - key: ENABLE_ANTI_SPAM_SHIELD
        value: "true"
      - key: SESSION_SECRET
        sync: false
      # Salesforce Connected App (past-due payments sync) - fill in via the Render dashboard
      - key: SF_LOGIN_URL
        sync: false
      - key: SF_CLIENT_ID
        sync: false
      - key: SF_CLIENT_SECRET
        sync: false
      - key: SF_CALLBACK_URL
        sync: false
      # Override if the default Lead query's guessed custom field names
      # (Import_Notes__c, Trade_Show__c) don't match this org's Salesforce schema
      - key: SF_LEADS_SOQL
        sync: false
      # Overrides for the Account/Opportunity sync default queries, only needed
      # if this org's schema differs from the standard fields they query
      - key: SF_ACCOUNTS_SOQL
        sync: false
      - key: SF_OPPORTUNITIES_SOQL
        sync: false
      # Cart.com Connected App ("LilyPad", App ID 13) - fill in via the Render dashboard
      - key: CART_STORE_URL
        value: https://www.froggysfog.com
      - key: CART_APP_ID
        sync: false
      - key: CART_APP_SECRET
        sync: false
      - key: CART_CALLBACK_URL
        sync: false
      - key: REMINDER_CHECK_MINUTES
        value: "5"
      # How often the background job pulls Customers/Orders/Accounts/Opportunities/
      # Past Due data from Salesforce into local storage (minutes)
      - key: SF_SYNC_CHECK_MINUTES
        value: "60"
      # How long a login session lasts before auto-expiring (days) - was
      # hardcoded to 365, which let the sessions collection grow unbounded
      - key: SESSION_MAX_AGE_DAYS
        value: "90"
      # SMTP (past-due payment reminder emails) - fill in via the Render dashboard
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Lead Prospector (Apollo.io API key, required) - fill in via the Render dashboard
      - key: APOLLO_API_KEY
        sync: false
      # Optional secondary email verification hook for staged leads - leave
      # unset to use the built-in stub (passes Apollo's own email status
      # through unchanged). Set to "zerobounce" or "millionverifier" plus
      # the matching API key below to enable a real verifier.
      - key: EMAIL_VERIFIER_PROVIDER
        value: stub
      - key: ZEROBOUNCE_API_KEY
        sync: false
      - key: MILLIONVERIFIER_API_KEY
        sync: false
      # In-house Lead Prospector pipeline: LLM structured extraction from
      # crawled pages (names/roles/emails) - fill in via the Render dashboard.
      # PROSPECTOR_EXTRACTION_MODEL defaults to a fast/cheap model if unset.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PROSPECTOR_EXTRACTION_MODEL
        value: claude-haiku-4-5
      # NOTE: this service is on the "starter" plan (512MB RAM). Running
      # headless Chromium for the in-house crawler alongside the rest of
      # this Node app is a real memory risk on that plan - if crawl batches
      # start crashing the dyno (OOM restarts), the fix is upgrading to at
      # least a "Standard" instance, not a code change.
      # Customer Intelligence (entity resolution + AI recommendations over
      # existing accounts) - reuses ANTHROPIC_API_KEY above, no separate key.
      - key: RECOMMENDATION_MODEL
        value: claude-haiku-4-5
      # How many days since existingAccountsAdapter.js last crawled an
      # account before it's eligible to be refreshed again.
      - key: PROSPECTOR_REFRESH_STALE_DAYS
        value: "90"

